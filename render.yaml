services:
  - type: web
    name: entrance-gateway
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /admin
    envVars:
      - key: NODE_VERSION
        value: 24.11.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
    # the database and the pass-signing key live here and must survive deploys
    disk:
      name: gateway-data
      mountPath: /var/data
      sizeGB: 1
